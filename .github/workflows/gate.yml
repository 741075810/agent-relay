# The publish gate, on every push.
#
# Runs on Windows because that is what this project is: the native messaging host, the
# launcher and the preflight are Windows-specific, and several suites legitimately skip
# when a Windows binary is absent. A Linux runner would report a different set of skips
# and prove something about a platform this code does not run on.
#
# The checkout here *is* the clean clone that `--clean-clone` would build locally, so it
# is not requested twice: what arrives in a runner is exactly what a reader would get.
name: gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `zstandard` is a runtime dependency of host.py, not a test-only one: without it
      # `native_turns` reports `zstandard_missing` and reads zero turns, so the notify
      # chain has nothing to offer. It was undeclared until a runner without it turned
      # thirty-odd tests into skips and six into errors.
      - name: install host dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          # 24, not 20. The session-log fixtures are zstd-compressed, and
          # `zlib.zstdCompressSync` arrived in Node 22.15; on Node 20 the suites either
          # skipped or errored depending on how each one asked. Pinning the runner to the
          # same major as the machine the suites are developed on means a green run there
          # means what a green run here means.
          node-version: '24'

      # One step, because the point of the gate is that nobody assembles the checks by
      # hand and nobody reads a number out of a log and retypes it.
      #
      # `--github` makes the failure explain itself in the check-run annotations, which
      # are public. Job logs need `actions: read`; annotations do not, so a red run can
      # be diagnosed without a token. The first six runs of this workflow were red and
      # the only thing readable was "Process completed with exit code 1".
      - name: release gate
        run: python -B tools/release_gate.py --github

      # Kept as its own step so a hygiene failure is legible even when a suite is also
      # red. The gate already ran it; repeating the scan costs a second and names the
      # rule that fired.
      - name: hygiene, verbose
        if: always()
        run: python -B tools/hygiene_scan.py --all
